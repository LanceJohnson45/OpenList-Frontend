name: Fork Docker image

on:
  workflow_dispatch:
    inputs:
      frontend_repository:
        description: "Frontend repository, for example: your-name/OpenList-Frontend"
        required: false
        type: string
      image_tag:
        description: "Extra image tag to publish"
        required: false
        default: "latest"
        type: string
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/openlist-fork
  FRONTEND_REPOSITORY: ${{ github.event.inputs.frontend_repository || vars.FRONTEND_REPOSITORY || format('{0}/OpenList-Frontend', github.repository_owner) }}

jobs:
  build:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backend
        uses: actions/checkout@v7

      - name: Checkout frontend
        uses: actions/checkout@v7
        with:
          repository: ${{ env.FRONTEND_REPOSITORY }}
          token: ${{ secrets.FRONTEND_REPOSITORY_TOKEN || secrets.GITHUB_TOKEN }}
          path: frontend-src

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=raw,value=${{ github.event.inputs.image_tag || 'latest' }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.fork
          build-contexts: |
            frontend-src=./frontend-src
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            BASE_IMAGE_TAG=base
            FRONTEND_LITE=false
            VERSION=fork
            WEB_VERSION=local
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
